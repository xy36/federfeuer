# Baut die Web-Version und veröffentlicht sie auf GitHub Pages
# (https://<user>.github.io/<repo>/). Veröffentlicht wird nur von main;
# auf anderen Branches wird nur gebaut, um Fehler früh zu sehen.
# Einmalig nötig: Repo-Einstellungen → Pages → Source: „GitHub Actions“.
name: Web (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [main, windows-build]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true

      - run: flutter pub get

      # Projektseiten liegen unter /<repo>/ – das muss der Build wissen
      - run: flutter build web --release --base-href /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
