# Baut eine portable Windows-Version (ZIP: entpacken, Federfeuer.exe starten).
# Flutter kann Windows nur auf Windows bauen, daher läuft das auf einem GitHub-Windows-Runner.
name: Windows-Build

on:
  workflow_dispatch:
  push:
    branches: [main, windows-build]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build windows --release

      # Visual-C++-Laufzeit beilegen, damit das Spiel auch ohne installierte Redistributable startet
      - name: Laufzeitbibliotheken beilegen
        shell: pwsh
        run: |
          $out = "build/windows/x64/runner/Release"
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR\System32\$dll" $out
          }
          Get-ChildItem $out

      - uses: actions/upload-artifact@v4
        with:
          name: Federfeuer-Windows
          path: build/windows/x64/runner/Release/
          retention-days: 30
